name: Weekly competitor report
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: data/competitor_intelligence.db
          key: aci-db-weekly-${{ github.run_id }}
          restore-keys: aci-db-
      - run: python -m src.main init-db
      - run: python -m src.main weekly-report
      - uses: actions/upload-artifact@v4
        with: {name: weekly-competitor-report, path: reports/output, retention-days: 90}
