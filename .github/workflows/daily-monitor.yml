name: Daily competitor monitor
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: data/competitor_intelligence.db
          key: aci-db-${{ github.run_id }}
          restore-keys: aci-db-
      - run: python -m src.main init-db
      - run: python -m src.main scan-brokers
      - run: python -m src.main scan-announcements
      - uses: actions/cache/save@v4
        with:
          path: data/competitor_intelligence.db
          key: aci-db-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with: {name: competitor-intelligence-db, path: data/competitor_intelligence.db, retention-days: 30}
